# canopy as a shared backend on the tailnet. The host is already a tailnet
# node, so canopy's port is published on the host's tailnet address alone
# (never the LAN, never 0.0.0.0) and every device on the tailnet reaches it as
# http://<host>:7850. Settings come from a .env next to this file; see
# docs/deploy.md for the first run. For a host that is NOT on the tailnet,
# add docker-compose.sidecar.yml, which joins canopy to a tailscale sidecar.
# The `tunnel` service (profile `tunnel`, off unless .env turns it on) also
# puts canopy on a public name through a Cloudflare Tunnel.
services:
  # The tmux server that holds every shell, in a container of its own so a
  # canopy redeploy (which recreates the canopy container) leaves the shells
  # running; canopy's tmux client reaches it over the socket on the shared
  # config volume. Built from the `shells` stage of the Dockerfile, which
  # carries no canopy code, so a canopy change does not move this image and
  # compose leaves this container alone. The shells run HERE: this container
  # needs every mount and setting a shell needs, the same as canopy's.
  shells:
    build:
      context: .
      target: shells
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: canopy-shells:latest
    environment:
      - CANOPY_CONFIG_DIR=/config
      # gh's login from .env, and gh as git's credential helper for
      # github.com, the same as canopy's below, so gh and a push or fetch of
      # a private repo work in a shell
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=credential.https://github.com.helper
      - GIT_CONFIG_VALUE_0=!gh auth git-credential
      # the container has no browser (no xdg-open), so a dev server started
      # with an open flag (`vite --open`) skips it instead of logging an
      # ENOENT stack trace
      - BROWSER=none
    volumes:
      - ${DEV_ROOT:-/home/eric/dev}:${DEV_ROOT:-/home/eric/dev}
      - canopy-config:/config
      - ${HOST_HOME:-/home/eric}/.claude:/home/bun/.claude
      - ${HOST_HOME:-/home/eric}/.claude.json:/home/bun/.claude.json
      - ${HOST_HOME:-/home/eric}/.codex:/home/bun/.codex
      # the convex CLI's login (config.json), so `convex dev` in a shell
      # reaches its cloud deployment; without it the CLI asks to log in,
      # which fails under `bun run --filter` (no TTY). scripts/redeploy.sh
      # makes the folder on the host first, since docker would make it as
      # root; a login in a shell lands there and outlives the container
      - ${HOST_HOME:-/home/eric}/.convex:/home/bun/.convex
      - ${HOST_HOME:-/home/eric}/.ssh:/home/bun/.ssh:ro
      # the host's git identity and global ignore, so a commit in a shell has
      # an author; the folder must exist on the host first or docker makes it
      # as root
      - ${HOST_HOME:-/home/eric}/.config/git:/home/bun/.config/git:ro
      # the host's time zone, so a shell prompt's clock is the host's
      - /etc/localtime:/etc/localtime:ro
    # canopy shares this container's network (and process) namespace, so
    # its ports are published here: canopy's own, and the preview ports the
    # in-app browser proxies a dev server through. A dev server started in a
    # shell listens on this loopback, which is canopy's loopback too.
    # CANOPY_LISTEN is the host's tailnet IP (tailscale ip -4); loopback
    # when unset, so a missing .env cannot put canopy on the LAN
    ports:
      - "${CANOPY_LISTEN:-127.0.0.1}:7850:7850"
      - "${CANOPY_LISTEN:-127.0.0.1}:7860-7869:7860-7869"
    # the name the tunnel's ingress (http://canopy:7850) dials, which is
    # canopy's port in this namespace
    networks:
      default:
        aliases: [canopy]
    # up once the socket answers, so canopy's first new-session never starts
    # a server of its own (one inside the canopy container, gone with it)
    healthcheck:
      test: ["CMD", "tmux", "-S", "/config/tmux.sock", "list-sessions"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  # The incubator's agents and their checks: no token, its own pid namespace
  # and network, the seeds and nothing else of the workspace. canopy starts
  # processes here only through the stage runner's socket.
  stages:
    build:
      context: .
      target: stages
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: canopy-stages:latest
    environment:
      - CANOPY_STAGE_ROOT=${DEV_ROOT:-/home/eric/dev}/_incubator
      - CANOPY_STAGE_SOCKET=/run/canopy-stage/runner.sock
      # a URL past the host that answers HTTP whenever nothing drops the
      # packet (the LAN router's page): the runner starts nothing until its
      # probe of it times out. Set in .env; unset, every stage waits.
      - CANOPY_FENCE_PROBE=${CANOPY_FENCE_PROBE:-}
      - LANG=C.UTF-8
    volumes:
      # every one of these must exist on the host, owned by the host user,
      # before `up`: docker makes a missing one as root, and a root .shared
      # stops canopy copying a stage's inputs in
      - ${DEV_ROOT:-/home/eric/dev}/_incubator:${DEV_ROOT:-/home/eric/dev}/_incubator
      - ${DEV_ROOT:-/home/eric/dev}/_incubator/.shared:${DEV_ROOT:-/home/eric/dev}/_incubator/.shared:ro
      # the stages' own claude and codex logins, never the host's
      - ${HOST_HOME:-/home/eric}/.config/canopy-stages/claude:/home/bun/.stage-claude
      - ${HOST_HOME:-/home/eric}/.config/canopy-stages/codex:/home/bun/.stage-codex
      - stage-sock:/run/canopy-stage
    networks: [stages-net]
    # docker's embedded resolver forwards each query from the container's own
    # namespace, through the fenced bridge, so the host's upstream (the
    # router, tailscale's 100.100.100.100) would be dropped; public servers
    # are not
    dns: [1.1.1.1, 9.9.9.9]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "/app/stage-runner.js", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  canopy:
    build:
      context: .
      # the uid and gid the container runs as: the host user who owns the
      # repo tree and the logins (id -u, id -g)
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        # the commit being built, for /api/about and the UI's stamp (the
        # image has no .git); scripts/redeploy.sh exports both
        CANOPY_COMMIT: ${CANOPY_COMMIT:-}
        CANOPY_COMMITTED: ${CANOPY_COMMITTED:-}
    image: canopy-backend:latest
    depends_on:
      shells:
        condition: service_healthy
        # a container on another's network loses it when that one restarts;
        # compose restarts canopy along with shells
        restart: true
      # the incubator's stages run there, through the runner's socket
      stages:
        condition: service_healthy
    # In the shells container's network and process namespaces: the in-app
    # browser dials a dev server on the loopback the shells listen on, and
    # reads /proc to tell which repo each listening process runs in. The
    # ports are published on the shells service above.
    network_mode: "service:shells"
    pid: "service:shells"
    environment:
      - CANOPY_CONFIG_DIR=/config
      # how a client reaches THIS host over ssh for VS Code Remote-SSH; the
      # repo tree is mounted at the same path it has on the host (below), so
      # the link resolves on the host too
      - CANOPY_SSH_HOST=${CANOPY_SSH_HOST:-canopy}
      - CANOPY_TMUX=1
      # listen on the container's interfaces so the published port reaches
      # it; on a Mac canopy binds loopback, but here the tailnet is the trust
      # edge and docker publishes the port on that address only
      - CANOPY_BIND=0.0.0.0
      # tailchan, the tailnet message broker: its address and the handle the
      # UI speaks as, both from .env and both optional (empty turns it off).
      # A broker on this same host sees canopy's bridge address, so it needs
      # this compose network in its TRUST_NETS and a firewall allow to it.
      - CANOPY_TAILCHAN_URL=${TAILCHAN_URL:-}
      - CANOPY_TAILCHAN_AS=${TAILCHAN_HUMAN:-}
      # No answer token here, on purpose: each browser keeps its own answer
      # key (Settings) and canopy only forwards it. canopy shares the shells'
      # pid namespace as the same user, so any agent could read a secret out
      # of this service's environment (docs/deploy.md, "Asks, presence and
      # guards").
      # gh's login for the pull request counts and the release listings, and
      # the AI gateway key the verdict gates are evaluated with; both come
      # from .env and both are optional
      - GH_TOKEN=${GH_TOKEN:-}
      # the same login is git's for github.com over https, through gh, so a
      # push from the panel and the background fetch of a private repo work
      # here; with GH_TOKEN empty gh has nothing to hand over and git fails
      # the way it did without the helper
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=credential.https://github.com.helper
      - GIT_CONFIG_VALUE_0=!gh auth git-credential
      - VERCEL_AI_GATEWAY_API_KEY=${VERCEL_AI_GATEWAY_API_KEY:-}
      # the https origin the tunnel serves canopy at (https://canopy.beric.ca);
      # requests for that host with X-Forwarded-Proto: https pass the origin
      # gate. Empty when there is no tunnel
      - CANOPY_PUBLIC_ORIGIN=${CANOPY_PUBLIC_ORIGIN:-}
      # each preview port's own public name on the same tunnel, {slot} for
      # the port (https://canopy-p{slot}.beric.ca), so the public page can
      # frame a preview; every name needs a DNS record and an ingress rule
      # to http://canopy:<slot>. Empty keeps previews tailnet-only
      - CANOPY_PREVIEW_PUBLIC=${CANOPY_PREVIEW_PUBLIC:-}
      # the tailnet address the preview ports are published on, which
      # another machine's plain http canopy page frames them at (its gated
      # public names only work inside a beric.ca page). Loopback is dropped
      - CANOPY_PREVIEW_HOST=${CANOPY_LISTEN:-}
      # other canopy pages (another backend's, or this one's own behind
      # tailscale serve) allowed to drive this backend; see the
      # multi-backend spec. Empty when there are none.
      - CANOPY_ORIGINS=${CANOPY_ORIGINS:-}
      # The incubator. The vault token is the memory gateway's, scoped
      # `agent`; transcription is any OpenAI-style /v1/audio/transcriptions
      # server (LiteLLM on the mini), the URL its origin. Every value here is
      # readable by the agents canopy starts: canopy shares the shells
      # container's pid namespace, so /proc/<canopy>/environ is in reach, the
      # same as GH_TOKEN. canopy deletes the vault token and the transcribe
      # key from its own env once read, so no shell or run inherits them, but
      # /proc keeps the values it started with. Mint the vault token for this
      # alone and revoke it if it ever leaks. Empty is fine: the backend says
      # so once in its log.
      - CANOPY_VAULT_TOKEN=${CANOPY_VAULT_TOKEN:-}
      - CANOPY_VAULT_URL=${CANOPY_VAULT_URL:-}
      - CANOPY_TRANSCRIBE_URL=${CANOPY_TRANSCRIBE_URL:-}
      - CANOPY_TRANSCRIBE_KEY=${CANOPY_TRANSCRIBE_KEY:-}
      - CANOPY_TRANSCRIBE_MODEL=${CANOPY_TRANSCRIBE_MODEL:-}
      # the incubator's deploy (docs/deploy.md): a Vercel token, scoped to
      # the one team the incubator's projects go to, and that team's slug
      # when it is not the token's own account. Readable through
      # /proc/<canopy>/environ like the two above.
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - VERCEL_SCOPE=${VERCEL_SCOPE:-}
      - CANOPY_INCUBATOR_AUTOSTART=${CANOPY_INCUBATOR_AUTOSTART:-}
      # the stage runner's socket in the stages container (stage-sock below),
      # the one way canopy starts an agent, check or build in a seed
      - CANOPY_STAGE_SOCKET=/run/canopy-stage/runner.sock
    volumes:
      # the repos to scan, mounted at the SAME path they have on the host so
      # git in the container and VS Code Remote-SSH on the host agree
      - ${DEV_ROOT:-/home/eric/dev}:${DEV_ROOT:-/home/eric/dev}
      # durable canopy config and the tmux socket the shells service serves
      - canopy-config:/config
      # subscription logins, no API keys; refreshed by logging in on the host
      - ${HOST_HOME:-/home/eric}/.claude:/home/bun/.claude
      # claude's onboarding state and per-project trust live beside the dir;
      # `claude` on the host must have run once so the file exists (a bind
      # mount of a missing file would make it a directory)
      - ${HOST_HOME:-/home/eric}/.claude.json:/home/bun/.claude.json
      - ${HOST_HOME:-/home/eric}/.codex:/home/bun/.codex
      # keys and config for any repos kept on other hosts (ssh sources)
      - ${HOST_HOME:-/home/eric}/.ssh:/home/bun/.ssh:ro
      # the host's global git ignore, so a peer wip snapshot leaves out what
      # git on the host leaves out (.claude/settings.local.json and the like);
      # the folder must exist on the host first or docker makes it as root
      - ${HOST_HOME:-/home/eric}/.config/git:/home/bun/.config/git:ro
      # the stage runner's socket, shared with the stages service alone
      - stage-sock:/run/canopy-stage
    command:
      - bun
      - bin/canopy.ts
      - ui
      - ${DEV_ROOT:-/home/eric/dev}
      - --port
      - "7850"
      - --no-open
    restart: unless-stopped

  # A Cloudflare Tunnel to canopy for a public name (canopy.beric.ca), for
  # a device off the tailnet. Only under the `tunnel` profile, which .env
  # turns on with COMPOSE_PROFILES=tunnel, so a host without a token never
  # starts it. The tunnel is managed in the Zero Trust dashboard: its token
  # is TUNNEL_TOKEN in .env, and its public hostname's service is
  # http://canopy:7850, canopy by its name on this compose network.
  # canopy has no login of its own: Cloudflare Access on that hostname is
  # the only thing between the internet and every shell here. Nothing is
  # published on the host; cloudflared dials out.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # not ${TUNNEL_TOKEN:?}: compose interpolates every service, profile or
      # not, so a required variable would break `up` on every host without one
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - canopy
    restart: unless-stopped

volumes:
  canopy-config:
  # the stage runner's socket folder, owned by the stages' user (Dockerfile)
  stage-sock:

networks:
  # the stages' own bridge, off docker's default pools (ufw's docker range and
  # the tailchan rule cover those), and v4 only so this subnet is its whole
  # reach. The default network stays implicit.
  stages-net:
    driver: bridge
    # the host-side bridge's name, which scripts/stages-fence.sh matches with
    # -i; at most 15 characters, an interface name's limit. A stages-net made
    # before this line keeps docker's br-<id>: docker network rm it first
    driver_opts:
      com.docker.network.bridge.name: br-canopy-stg
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.250.13.0/24
