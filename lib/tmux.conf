# canopy's own tmux server, one session per shell, on a socket under the
# config dir. It is what lets a shell outlive the canopy server: the browser
# terminal is a client on it, and a restart only reattaches. The user never
# sees tmux: no status bar and no prefix, so every key reaches the shell.
# canopy drives it through the command line instead.

set -g status off
set -g prefix None
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# draw on the browser terminal's normal screen, not its alternate one, so
# lines that scroll off the pane land in xterm's own scrollback
set -as terminal-overrides ",xterm-256color:smcup@:rmcup@"
set -g escape-time 0
set -g history-limit 20000
set -g focus-events on
set -g allow-passthrough on
set -g set-titles off

# a shell that exits takes its session with it, the client (the canopy pty)
# with that, and the tmux server itself once no session is left
set -g remain-on-exit off
set -g detach-on-destroy on
set -g destroy-unattached off
set -g exit-empty on
