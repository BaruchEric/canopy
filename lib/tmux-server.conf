# The tmux server as a container of its own (the shells service in
# docker-compose.yml, `tmux -D` in the foreground): the shared conf, then
# stay up with no session. The shared conf's exit-empty would end the server
# at once, since it starts with nothing to hold, and the whole point of the
# container is to be there before the first shell and after the last.
source-file /app/lib/tmux.conf
set -g exit-empty off
