[workspace]
resolver = "3"
members = ["crates/canopy-core", "crates/canopy-auth", "crates/canopy-cli", "crates/canopy-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
