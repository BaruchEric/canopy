[package]
name = "canopy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jiff = "1.0.3"
rand = "0.10.4"
regex = "1.13.2"
rustix = { version = "1.1.6", features = ["process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
url = "2.5.9"

[dev-dependencies]
tempfile = "3.27.0"
